<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDpedia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #030005;
            --surface-color: #0d001a;
            --primary-purple: #9333ea;
            --glow-purple: rgba(147, 51, 234, 0.4);
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-color); 
            color: #f8fafc; 
            overflow-x: hidden; 
        }

        h1, h2, h3, h4, .font-heading {
            font-family: 'Rajdhani', sans-serif;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #2e1065; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-purple); }
        
        .fade-in { animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .glass-panel {
            background: rgba(13, 0, 26, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-top: 1px solid rgba(147, 51, 234, 0.2);
        }

        .gallery-card {
            background: var(--surface-color);
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
        }

        .gallery-card:hover {
            border-color: rgba(147, 51, 234, 0.5);
            box-shadow: 0 10px 30px -10px var(--glow-purple);
            transform: translateY(-5px);
        }

        .ambient-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at 50% 0%, rgba(147, 51, 234, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 100% 100%, rgba(88, 28, 135, 0.08) 0%, transparent 50%);
            z-index: -1;
            pointer-events: none;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }
        .stat-card:hover {
            background: rgba(147, 51, 234, 0.05);
            border-color: rgba(147, 51, 234, 0.2);
        }

        .tier-badge {
            background: linear-gradient(135deg, #a855f7, #6b21a8);
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .hero-text {
            background: linear-gradient(to bottom, #fff, #a855f7);
            /* Standard property (Modern browsers) */
            background-clip: text; 
            /* Vendor prefix (Chrome, Safari, Edge) */
            -webkit-background-clip: text; 
            /* Required to make the text transparent so background shows through */
            -webkit-text-fill-color: transparent; 
            /* Fallback for older browsers */
            color: transparent; 
        }

        .section-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(147, 51, 234, 0.3), transparent);
        }
    </style>
</head>
<body>
    <div class="ambient-bg"></div>
    <div id="app" class="min-h-screen flex flex-col">
        <!-- Loader -->
        <div class="flex-1 flex flex-col items-center justify-center gap-6">
            <div class="relative w-16 h-16 flex items-center justify-center">
                <div class="absolute inset-0 border-2 border-purple-900/30 rounded-full"></div>
                <div class="absolute inset-0 border-2 border-purple-600 rounded-full border-t-transparent animate-spin"></div>
                <i data-lucide="database" class="w-6 h-6 text-purple-500"></i>
            </div>
            <div class="font-heading text-purple-500/80 tracking-[0.2em] uppercase text-sm">Accessing RDPedia Archives...</div>
        </div>
    </div>

    <script>
        const LOGO_URL = 'https://media.discordapp.net/attachments/1503075514573783103/1503729514759454801/smal.png?ex=6a05ba3e&is=6a0468be&hm=45b719dd413d29d89d921eb01f2f597eb8d756a7138f27b80c8e3537df3e756c&=&format=webp&quality=lossless&width=242&height=240';
        const SCRATCH_STUDIO_URL = 'https://scratch.mit.edu/studios/32554522/';

        const RD_DATABASE = {
            players: [
                {
                    username: '--fathom',
                    skinUrl: 'https://media.discordapp.net/attachments/1503075514573783103/1503096199446659143/4579A634-E835-4F46-94E8-6ACDE1932D34_4_5005_c.jpeg?ex=6a021aec&is=6a00c96c&hm=e16acfea7a010a416b6f4d9cb58769f6774f74ab9cc1b0cead229250d10062ea&=&format=webp&width=340&height=304',
                    notableImageUrl: 'https://media.discordapp.net/attachments/1503075514573783103/1503075848536723586/Screenshot_2026-04-04_at_11.10.50_PM.png?ex=6a0207f8&is=6a00b678&hm=3a91e8c8da988835381f42b73353fe050159bc4bb36321d54ba9af10791887a7&=&format=webp&quality=lossless&width=1576&height=1586',
                    isNotable: true,
                    description: 'Primary architect of the RDPedia ecosystem. Known for tactical precision and database management.',
                    clans: ['The Vanguard'],
                    stats: { tier: 'S', era: '1st Gen', primaryWeapon: 'Shotgun', secondaryWeapon: 'None', skin: 'Stealth', status: 'active', perks: ['+Bounce', '+Melee'] }
                }
            ],
            clans: [
                {
                    name: 'The Vanguard',
                    description: 'A coalition of legendary players from the earliest eras.',
                    bgUrl: 'https://images.unsplash.com/photo-1614850523296-d8c1af93d400?auto=format&fit=crop&q=80&w=1600'
                }
            ]
        };

        const state = {
            isReady: false,
            activeTab: 'home',
            searchQuery: '',
            sortBy: 'rank',
            currentNotableIndex: 0,
            currentClanIndex: 0,
            selectedPlayerName: null
        };

        const STATUS_CONFIG = {
            'active': { color: 'text-emerald-500', bg: 'bg-emerald-500/10', dot: 'bg-emerald-500' },
            'inactive': { color: 'text-orange-500', bg: 'bg-orange-500/10', dot: 'bg-orange-500' },
            'idle': { color: 'text-blue-400', bg: 'bg-blue-400/10', dot: 'bg-blue-400' },
            'gone/disappeared': { color: 'text-gray-400', bg: 'bg-gray-400/10', dot: 'bg-gray-400' },
            'banned': { color: 'text-red-500', bg: 'bg-red-500/10', dot: 'bg-red-500' },
            'unknown': { color: 'text-gray-500', bg: 'bg-gray-500/10', dot: 'bg-gray-500' }
        };

        async function fetchSheetData() {
            const sheetId = '1BTtRLi0tsjutBWm5OEe-5xx2OO8GFGiZhzZ1J7AN8r8';
            const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;
            
            try {
                const response = await fetch(url);
                const text = await response.text();
                const jsonText = text.substring(text.indexOf('(') + 1, text.lastIndexOf(')'));
                const data = JSON.parse(jsonText);
                
                let cols = data.table.cols.map(c => c ? (c.label || '').toLowerCase().replace(/[^a-z0-9]/g, '') : '');
                let rows = data.table.rows;

                if (cols.every(c => c === '')) {
                    cols = rows[0].c.map(c => c ? String(c.v || c.f || '').toLowerCase().replace(/[^a-z0-9]/g, '') : '');
                    rows = rows.slice(1);
                }

                const newPlayers = [];
                rows.forEach(row => {
                    if (!row.c) return;
                    const rowData = {};
                    row.c.forEach((cell, i) => {
                        if (cols[i]) {
                            let val = cell ? (cell.v !== null && cell.v !== undefined ? cell.v : (cell.f || '')) : '';
                            rowData[cols[i]] = val;
                        }
                    });
                    
                    const username = String(rowData.username || rowData.name || '');
                    if (!username || username === 'null') return;

                    const getArr = (val) => {
                        if (typeof val === 'string' && val) return val.split(',').map(s => s.trim()).filter(Boolean);
                        return val ? [String(val)] : [];
                    };
                    
                    const statusRaw = String(rowData.status || 'unknown').toLowerCase();
                    const status = Object.keys(STATUS_CONFIG).find(s => statusRaw.includes(s)) || 'unknown';
                    let isNotable = ['true', 'yes', '1', 'y'].includes(String(rowData.isnotable || rowData.notable).toLowerCase());

                    newPlayers.push({
                        username: username,
                        skinUrl: String(rowData.skinimageurl || rowData.skinurl || rowData.imageurl || rowData.image || rowData.skin || 'https://images.unsplash.com/photo-1510511459019-5d644d508305?auto=format&fit=crop&q=80&w=800'),
                        notableImageUrl: String(rowData.notableimageurl || rowData.notableimage || ''),
                        isNotable: isNotable,
                        description: String(rowData.description || rowData.desc || 'Record maintained in the RDPedia archives.'),
                        clans: getArr(rowData.clans || rowData.clan),
                        stats: {
                            tier: String(rowData.tier || rowData.rank || 'N/A'),
                            era: String(rowData.era || rowData.generation || 'Unknown'),
                            primaryWeapon: String(rowData.primaryweapon || rowData.primary || 'Standard'),
                            secondaryWeapon: String(rowData.secondaryweapon || rowData.secondary || 'None'),
                            skin: String(rowData.signatureskin || rowData.skinname || 'Default'),
                            status: status,
                            perks: getArr(rowData.perks || rowData.perk || 'None')
                        }
                    });
                });

                if (newPlayers.length > 0) RD_DATABASE.players = newPlayers;
            } catch (error) {
                console.warn("Using cached RDPedia data.");
            }
        }

        window.switchTab = (tab) => {
            state.activeTab = tab;
            state.searchQuery = '';
            state.selectedPlayerName = null;
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.viewPlayer = (name) => {
            state.selectedPlayerName = name;
            render();
        };

        window.updateSearch = (val) => {
            state.searchQuery = val;
            render();
            setTimeout(() => {
                const el = document.getElementById('gallery-search');
                if (el) { el.focus(); el.setSelectionRange(val.length, val.length); }
            }, 0);
        };

        window.updateSort = (val) => {
            state.sortBy = val;
            render();
        };

        window.nextSlide = (type) => {
            const pool = type === 'notable' ? RD_DATABASE.players.filter(p => p.isNotable) : RD_DATABASE.clans;
            if (pool.length > 0) {
                if (type === 'notable') state.currentNotableIndex = (state.currentNotableIndex + 1) % pool.length;
                else state.currentClanIndex = (state.currentClanIndex + 1) % pool.length;
                render();
            }
        };

        window.prevSlide = (type) => {
            const pool = type === 'notable' ? RD_DATABASE.players.filter(p => p.isNotable) : RD_DATABASE.clans;
            if (pool.length > 0) {
                if (type === 'notable') state.currentNotableIndex = (state.currentNotableIndex - 1 + pool.length) % pool.length;
                else state.currentClanIndex = (state.currentClanIndex - 1 + pool.length) % pool.length;
                render();
            }
        };

        function render() {
            const root = document.getElementById('app');
            if (!state.isReady || !root) return; 

            root.innerHTML = `
                ${renderNav()}
                <main class="flex-1 flex flex-col relative z-10">
                    ${state.selectedPlayerName ? renderPlayerProfile() : renderActiveTab()}
                </main>
                ${renderFooter()}
            `;
            lucide.createIcons();
        }

        function renderNav() {
            return `
            <nav class="glass-panel sticky top-0 z-50">
                <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
                    <div class="flex items-center gap-3 cursor-pointer group" onclick="switchTab('home')">
                        <img src="${LOGO_URL}" class="w-10 h-10 object-contain group-hover:scale-110 transition-transform">
                        <h1 class="font-heading text-2xl font-bold tracking-[0.15em] text-white uppercase hidden sm:block">RDPEDIA</h1>
                    </div>
                    
                    <div class="flex items-center gap-1 sm:gap-2">
                        ${['home', 'gallery', 'notable', 'clans'].map(id => `
                            <button onclick="switchTab('${id}')" 
                                class="px-3 sm:px-5 py-2 rounded-full text-[10px] sm:text-xs font-heading font-semibold uppercase tracking-widest transition-all
                                ${state.activeTab === id && !state.selectedPlayerName
                                    ? 'bg-purple-600 text-white shadow-[0_0_15px_rgba(147,51,234,0.4)]' 
                                    : 'text-gray-400 hover:text-white hover:bg-white/5'}">
                                ${id}
                            </button>
                        `).join('')}
                    </div>
                </div>
            </nav>`;
        }

        function renderActiveTab() {
            switch(state.activeTab) {
                case 'home': return renderHome();
                case 'gallery': return renderGallery();
                case 'notable': return renderCarousel(RD_DATABASE.players.filter(p => p.isNotable), 'notable');
                case 'clans': return renderCarousel(RD_DATABASE.clans, 'clan');
                default: return renderHome();
            }
        }

        function renderHome() {
            return `
            <div class="fade-in">
                <!-- Hero Section -->
                <section class="min-h-[85vh] flex flex-col items-center justify-center text-center px-6 relative overflow-hidden">
                    <div class="absolute inset-0 bg-purple-900/10 animate-pulse blur-[100px] rounded-full scale-50"></div>
                    <img src="${LOGO_URL}" class="w-48 h-48 mb-10 drop-shadow-[0_0_40px_rgba(147,51,234,0.5)]">
                    <h2 class="font-heading text-6xl md:text-8xl font-black uppercase tracking-tighter hero-text mb-6">RDPEDIA ARCHIVE</h2>
                    <p class="text-gray-400 text-xl max-w-2xl font-light mb-12 leading-relaxed tracking-wide">
                        The definitive database for RDP. Tracking historical records, player eras, and the tactical evolution of our community.
                    </p>
                    <div class="flex flex-wrap justify-center gap-6">
                        <button onclick="switchTab('gallery')" class="px-10 py-4 bg-purple-600 rounded-xl font-heading font-bold uppercase tracking-widest hover:bg-purple-500 transition-all shadow-[0_10px_30px_-10px_rgba(147,51,234,0.6)]">Access Database</button>
                        <a href="${SCRATCH_STUDIO_URL}" target="_blank" class="px-10 py-4 bg-white/5 border border-white/10 rounded-xl font-heading font-bold uppercase tracking-widest hover:bg-white/10 transition-all">Scratch Studio</a>
                    </div>
                </section>

                <!-- About Us -->
                <section class="max-w-6xl mx-auto px-6 py-24">
                    <div class="grid md:grid-cols-2 gap-20 items-center">
                        <div class="space-y-8">
                            <div>
                                <div class="text-purple-500 font-heading font-bold uppercase tracking-[0.4em] text-sm mb-4">Foundation</div>
                                <h3 class="text-5xl font-heading font-bold text-white uppercase leading-tight">The Core of RDPedia</h3>
                            </div>
                            <p class="text-gray-400 text-lg leading-relaxed font-light">
                                RDP is a high-stakes Scratch environment where players compete in a legacy of combat and coordination. 
                                RDPedia was established to archive this history, providing a permanent record for every player who makes their mark.
                            </p>
                            <div class="grid grid-cols-2 gap-10">
                                <div>
                                    <div class="text-4xl font-heading font-bold text-white">${RD_DATABASE.players.length}+</div>
                                    <div class="text-gray-500 text-xs uppercase tracking-widest mt-1">Players Cataloged</div>
                                </div>
                                <div>
                                    <div class="text-4xl font-heading font-bold text-white">HISTORY</div>
                                    <div class="text-gray-500 text-xs uppercase tracking-widest mt-1">Generations Tracked</div>
                                </div>
                            </div>
                        </div>
                        <div class="relative group">
                            <div class="absolute -inset-4 bg-purple-600/20 rounded-3xl blur-2xl group-hover:bg-purple-600/30 transition-all"></div>
                            <div class="glass-panel p-1 rounded-3xl overflow-hidden relative border-purple-500/20">
                                <img src="https://images.unsplash.com/photo-1614850523459-c2f4c699c52e?auto=format&fit=crop&q=80&w=1200" class="w-full aspect-video object-cover rounded-2xl opacity-60">
                                <div class="absolute inset-0 flex items-center justify-center">
                                    <i data-lucide="shield" class="w-20 h-20 text-white/20"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <div class="section-divider"></div>

                <!-- Archivists Section -->
                <section class="max-w-6xl mx-auto px-6 py-24">
                    <div class="text-center max-w-3xl mx-auto mb-20">
                        <h3 class="text-5xl font-heading font-bold text-white uppercase mb-6 tracking-tight">THE ARCHIVISTS</h3>
                        <p class="text-gray-400 text-lg font-light">RDPedia is maintained by two dedicated Robot Destructor veterans.</p>
                    </div>
                    <div class="grid md:grid-cols-2 gap-12">
                        <!-- Fathom -->
                        <div class="glass-panel p-10 rounded-3xl relative overflow-hidden group hover:border-teal-500/50 transition-all duration-500">
                             <div class="absolute -inset-4 bg-teal-500/5 blur-3xl opacity-0 group-hover:opacity-100 transition-opacity"></div>
                             <div class="relative z-10">
                                <div class="flex items-center justify-between mb-8">
                                    <div class="w-16 h-16 bg-teal-500/10 border border-teal-500/20 rounded-2xl flex items-center justify-center text-teal-400 shadow-inner">
                                        <i data-lucide="swords" class="w-8 h-8"></i>
                                    </div>
                                    <div class="px-4 py-1.5 bg-teal-500/10 text-teal-400 border border-teal-500/20 rounded-full text-[10px] font-bold uppercase tracking-widest">High Level Player</div>
                                </div>
                                <h4 class="font-heading text-4xl font-bold text-white uppercase tracking-wider mb-2">--fathom</h4>
                                <div class="text-teal-400 font-heading text-sm uppercase tracking-[0.3em] mb-6">Active since 2021</div>
                                <p class="text-gray-400 leading-relaxed font-light">
                                    A cornerstone of the Robot Destructor community. With years of high-level tactical experience, fathom oversees the architecture and historical accuracy of the RDPedia databases.
                                </p>
                             </div>
                        </div>
                        <!-- Szawary -->
                        <div class="glass-panel p-10 rounded-3xl relative overflow-hidden group hover:border-red-500/50 transition-all duration-500">
                             <div class="absolute -inset-4 bg-red-500/5 blur-3xl opacity-0 group-hover:opacity-100 transition-opacity"></div>
                             <div class="relative z-10">
                                <div class="flex items-center justify-between mb-8">
                                    <div class="w-16 h-16 bg-red-500/10 border border-red-500/20 rounded-2xl flex items-center justify-center text-red-400 shadow-inner">
                                        <i data-lucide="crosshair" class="w-8 h-8"></i>
                                    </div>
                                    <div class="px-4 py-1.5 bg-red-500/10 text-red-400 border border-red-500/20 rounded-full text-[10px] font-bold uppercase tracking-widest">High Level Player</div>
                                </div>
                                <h4 class="font-heading text-4xl font-bold text-white uppercase tracking-wider mb-2">Szawary</h4>
                                <div class="text-red-400 font-heading text-sm uppercase tracking-[0.3em] mb-6">Active since 2024</div>
                                <p class="text-gray-400 leading-relaxed font-light">
                                    A rapidly rising elite within the Robot Destructor ranks. Sza brings fresh, high-tier operational knowledge to the team, rigorously curating player dossiers and records.
                                </p>
                             </div>
                        </div>
                    </div>
                </section>

                <div class="section-divider"></div>

                <!-- How to Apply -->
                <section class="bg-purple-950/10 py-24">
                    <div class="max-w-6xl mx-auto px-6">
                        <div class="text-center max-w-3xl mx-auto mb-20">
                            <h3 class="text-5xl font-heading font-bold text-white uppercase mb-6 tracking-tight">ENTRY PROTOCOLS</h3>
                            <p class="text-gray-500 text-lg">Secure your player profile in the archives by following these steps.</p>
                        </div>
                        <div class="grid md:grid-cols-3 gap-8">
                            <div class="glass-panel p-10 rounded-3xl relative overflow-hidden group">
                                <div class="absolute top-0 right-0 p-8 text-6xl font-heading font-black text-white/5 group-hover:text-purple-500/10 transition-colors">01</div>
                                <div class="w-14 h-14 bg-purple-600 rounded-2xl flex items-center justify-center mb-8 shadow-lg shadow-purple-600/20">
                                    <i data-lucide="file-edit" class="w-6 h-6 text-white"></i>
                                </div>
                                <h4 class="font-heading text-2xl font-bold text-white mb-4 uppercase tracking-wide">Data Submission</h4>
                                <p class="text-gray-400 leading-relaxed font-light">Visit the RDP Scratch Studio and post your current player stats in the comments section for review.</p>
                            </div>
                            <div class="glass-panel p-10 rounded-3xl relative overflow-hidden group">
                                <div class="absolute top-0 right-0 p-8 text-6xl font-heading font-black text-white/5 group-hover:text-purple-500/10 transition-colors">02</div>
                                <div class="w-14 h-14 bg-purple-600 rounded-2xl flex items-center justify-center mb-8 shadow-lg shadow-purple-600/20">
                                    <i data-lucide="user-check" class="w-6 h-6 text-white"></i>
                                </div>
                                <h4 class="font-heading text-2xl font-bold text-white mb-4 uppercase tracking-wide">Verification</h4>
                                <p class="text-gray-400 leading-relaxed font-light">Archivists will verify your status and tier. Inaccurate or false records will be discarded immediately.</p>
                            </div>
                            <div class="glass-panel p-10 rounded-3xl relative overflow-hidden group">
                                <div class="absolute top-0 right-0 p-8 text-6xl font-heading font-black text-white/5 group-hover:text-purple-500/10 transition-colors">03</div>
                                <div class="w-14 h-14 bg-purple-600 rounded-2xl flex items-center justify-center mb-8 shadow-lg shadow-purple-600/20">
                                    <i data-lucide="database-zap" class="w-6 h-6 text-white"></i>
                                </div>
                                <h4 class="font-heading text-2xl font-bold text-white mb-4 uppercase tracking-wide">Archiving</h4>
                                <p class="text-gray-400 leading-relaxed font-light">Once approved, your player dossier is added to RDPedia, visible to the entire community forever.</p>
                            </div>
                        </div>
                        <div class="mt-16 text-center">
                            <a href="${SCRATCH_STUDIO_URL}" target="_blank" class="inline-flex items-center gap-3 px-8 py-3 bg-white/5 border border-white/10 rounded-full text-purple-400 font-heading font-bold uppercase tracking-[0.2em] hover:bg-white/10 transition-all">
                                Open Submission Hub <i data-lucide="external-link" class="w-4 h-4"></i>
                            </a>
                        </div>
                    </div>
                </section>
            </div>
            `;
        }

        function renderGallery() {
            let filtered = RD_DATABASE.players.filter(p => p.username.toLowerCase().includes(state.searchQuery.toLowerCase()));
            const rankOrder = { 'S+': 1, 'S': 2, 'A': 3, 'B': 4, 'C': 5, 'D': 6, 'E': 7, 'F': 8 };
            
            filtered.sort((a, b) => {
                if (state.sortBy === 'rank') {
                    const rA = rankOrder[a.stats?.tier] || 99, rB = rankOrder[b.stats?.tier] || 99;
                    return rA !== rB ? rA - rB : a.username.localeCompare(b.username);
                } else if (state.sortBy === 'generation') {
                    const gA = parseInt(a.stats?.era) || 999, gB = parseInt(b.stats?.era) || 999;
                    return gA !== gB ? gA - gB : a.username.localeCompare(b.username);
                }
                return a.username.localeCompare(b.username);
            });
            
            return `
            <div class="p-6 md:p-10 max-w-7xl mx-auto w-full fade-in">
                <div class="mb-12 flex flex-col md:flex-row justify-between items-end gap-6">
                    <div>
                        <h2 class="font-heading text-4xl md:text-5xl font-bold text-white uppercase tracking-wider mb-2">PLAYER INDEX</h2>
                        <p class="text-gray-500 font-light tracking-wide text-lg">Browsing the complete RDPedia player records.</p>
                    </div>
                    
                    <div class="flex flex-col sm:flex-row items-center gap-4 w-full md:w-auto">
                        <select onchange="updateSort(this.value)" class="w-full sm:w-48 pl-4 pr-10 py-3 rounded-2xl bg-white/5 border border-white/10 text-white outline-none focus:border-purple-500/50 transition-all font-light appearance-none cursor-pointer">
                            <option value="rank" class="bg-[#0a0a0a]" ${state.sortBy === 'rank' ? 'selected' : ''}>Tier Order</option>
                            <option value="alphabetical" class="bg-[#0a0a0a]" ${state.sortBy === 'alphabetical' ? 'selected' : ''}>A-Z Order</option>
                            <option value="generation" class="bg-[#0a0a0a]" ${state.sortBy === 'generation' ? 'selected' : ''}>Era Order</option>
                        </select>
                        <div class="relative w-full sm:w-64">
                            <i data-lucide="search" class="absolute left-4 top-3.5 w-5 h-5 text-gray-500"></i>
                            <input type="text" id="gallery-search" placeholder="Search players..." value="${state.searchQuery}" oninput="updateSearch(this.value)" 
                                class="w-full pl-12 pr-4 py-3 rounded-2xl bg-white/5 border border-white/10 text-white outline-none focus:border-purple-500/50 transition-all font-light placeholder-gray-600">
                        </div>
                    </div>
                </div>
                
                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">
                    ${filtered.map(p => `
                        <div onclick="viewPlayer('${p.username}')" class="gallery-card rounded-2xl overflow-hidden group relative aspect-[4/5]">
                            <img src="${p.skinUrl}" class="w-full h-full object-cover opacity-50 group-hover:opacity-100 transition-all duration-700">
                            <div class="absolute inset-0 bg-gradient-to-t from-black via-black/20 to-transparent"></div>
                            <div class="absolute inset-0 p-5 flex flex-col justify-end">
                                <h3 class="font-heading text-lg font-bold text-white tracking-wide group-hover:text-purple-400 transition-colors">${p.username}</h3>
                                <div class="text-[10px] font-bold text-purple-400 uppercase tracking-widest">${p.stats?.tier || 'N/A'} TIER</div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            </div>`;
        }

        function renderPlayerProfile() {
            const p = RD_DATABASE.players.find(p => p.username === state.selectedPlayerName);
            if (!p) return '';
            const statusStyle = STATUS_CONFIG[p.stats.status] || STATUS_CONFIG['unknown'];

            return `
            <div class="p-6 md:p-10 max-w-5xl mx-auto w-full fade-in">
                <button onclick="switchTab('gallery')" class="flex items-center gap-2 text-gray-400 hover:text-purple-400 transition-colors mb-8 group uppercase tracking-widest text-xs font-bold font-heading">
                    <i data-lucide="chevron-left" class="w-5 h-5 group-hover:-translate-x-1 transition-transform"></i>
                    Return to Index
                </button>

                <div class="glass-panel rounded-3xl overflow-hidden shadow-2xl flex flex-col md:flex-row min-h-[550px]">
                    <div class="md:w-5/12 relative bg-black">
                        <img src="${p.skinUrl}" class="absolute inset-0 w-full h-full object-cover opacity-80">
                        <div class="absolute top-6 left-6 tier-badge px-4 py-2 rounded-lg font-heading font-black text-2xl shadow-xl">${p.stats.tier}</div>
                    </div>
                    <div class="md:w-7/12 p-8 md:p-14 flex flex-col">
                        <div class="${statusStyle.bg} ${statusStyle.color} w-fit px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-[0.2em] flex items-center gap-2 mb-4">
                            <div class="w-1.5 h-1.5 rounded-full ${statusStyle.dot} ${p.stats.status === 'active' ? 'animate-pulse' : ''}"></div>
                            ${p.stats.status}
                        </div>
                        <h2 class="font-heading text-6xl font-bold text-white tracking-tighter mb-6 uppercase">${p.username}</h2>
                        <p class="text-gray-400 text-lg leading-relaxed mb-12 font-light italic border-l-2 border-purple-900/40 pl-6">"${p.description}"</p>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-auto">
                            <div class="stat-card p-5 rounded-2xl">
                                <div class="text-[10px] text-gray-500 uppercase tracking-widest mb-3 font-bold">Preferred Loadout</div>
                                <div class="text-white font-heading font-bold text-lg flex items-center gap-3"><i data-lucide="target" class="w-3.5 h-3.5 text-purple-500"></i>${p.stats.primaryWeapon}</div>
                            </div>
                            <div class="stat-card p-5 rounded-2xl">
                                <div class="text-[10px] text-gray-500 uppercase tracking-widest mb-3 font-bold">Player Era</div>
                                <div class="text-white font-heading font-bold text-lg flex items-center gap-3"><i data-lucide="history" class="w-3.5 h-3.5 text-purple-500"></i>${p.stats.era}</div>
                            </div>
                            <div class="stat-card p-5 rounded-2xl sm:col-span-2">
                                <div class="text-[10px] text-gray-500 uppercase tracking-widest mb-3 font-bold">Clan Affiliations</div>
                                <div class="flex flex-wrap gap-2">
                                    ${(p.clans || []).map(c => `<span class="px-3 py-1 bg-white/5 border border-white/10 rounded text-xs text-white">${c}</span>`).join('') || '<span class="text-gray-600 italic uppercase">Solo Player</span>'}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        function renderCarousel(items, type) {
            if (items.length === 0) return `<div class="flex-1 flex flex-col items-center justify-center p-6 text-gray-600"><i data-lucide="database" class="w-16 h-16 mb-4 opacity-50"></i><h2 class="text-xl font-heading tracking-widest uppercase">No Records Available</h2></div>`;
            const idx = type === 'notable' ? state.currentNotableIndex : state.currentClanIndex;
            const item = items[idx];
            const displayImage = (type === 'notable' && item.notableImageUrl && item.notableImageUrl !== 'null') ? item.notableImageUrl : (item.bgUrl || item.skinUrl);
            const itemName = item.username || item.name;
            
            return `
            <div class="flex-1 relative flex flex-col overflow-hidden fade-in min-h-[80vh]">
                <div class="absolute inset-0 opacity-20 blur-3xl scale-110" style="background-image: url('${displayImage}'); background-size: cover; background-position: center;"></div>
                <div class="relative flex-1 flex items-center justify-center p-6 md:p-12 z-10">
                    <div class="w-full max-w-6xl glass-panel rounded-3xl overflow-hidden flex flex-col md:flex-row shadow-2xl h-[70vh]">
                        <div class="md:w-1/2 relative bg-black/50"><img src="${displayImage}" class="absolute inset-0 w-full h-full object-cover"></div>
                        <div class="md:w-1/2 p-8 md:p-16 flex flex-col justify-center bg-black/40">
                            <div class="text-purple-500 text-[10px] font-bold uppercase tracking-[0.4em] mb-4">${type === 'notable' ? 'Legendary Player' : 'Faction Archives'}</div>
                            <h2 class="font-heading text-6xl md:text-8xl font-bold text-white mb-8 tracking-tighter leading-none uppercase">${itemName}</h2>
                            <p class="text-gray-400 text-lg md:text-xl font-light mb-12 leading-relaxed">${item.description}</p>
                            ${type === 'notable' ? `<button onclick="viewPlayer('${itemName}')" class="px-10 py-4 rounded-xl bg-purple-600 text-white font-heading font-bold uppercase tracking-widest hover:bg-purple-500 transition-all w-fit shadow-lg shadow-purple-600/30">View Profile</button>` : ''}
                        </div>
                    </div>
                </div>
                <div class="absolute bottom-8 left-0 right-0 flex justify-center items-center gap-8 z-20">
                    <button onclick="prevSlide('${type}')" class="w-12 h-12 rounded-full flex items-center justify-center bg-white/5 border border-white/10 text-white hover:bg-purple-600 transition-all"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
                    <div class="flex gap-2">
                        ${items.map((_, i) => `<div class="w-1.5 h-1.5 rounded-full ${i === idx ? 'w-6 bg-purple-500' : 'bg-gray-700'} transition-all"></div>`).join('')}
                    </div>
                    <button onclick="nextSlide('${type}')" class="w-12 h-12 rounded-full flex items-center justify-center bg-white/5 border border-white/10 text-white hover:bg-purple-600 transition-all"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>
                </div>
            </div>`;
        }

        function renderFooter() {
            return `
            <footer class="mt-auto border-t border-white/5 py-12 px-6 bg-black/50">
                <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-8">
                    <div class="flex items-center gap-4">
                        <img src="${LOGO_URL}" class="w-8 h-8 opacity-40">
                        <span class="text-gray-600 font-heading font-bold uppercase tracking-[0.3em] text-[10px]">RDPEDIA Archival Division — © 2024</span>
                    </div>
                    <div class="flex gap-10">
                        <a href="${SCRATCH_STUDIO_URL}" target="_blank" class="text-gray-600 hover:text-purple-400 text-[10px] font-bold uppercase tracking-widest transition-colors">Studio</a>
                        <button onclick="switchTab('home')" class="text-gray-600 hover:text-purple-400 text-[10px] font-bold uppercase tracking-widest transition-colors">Home</button>
                        <button onclick="switchTab('gallery')" class="text-gray-600 hover:text-purple-400 text-[10px] font-bold uppercase tracking-widest transition-colors">Players</button>
                    </div>
                </div>
            </footer>
            `;
        }

        window.addEventListener('DOMContentLoaded', () => {
            fetchSheetData().finally(() => {
                setTimeout(() => {
                    state.isReady = true;
                    render();
                }, 1500);
            });
        });
    </script>
</body>
</html>
